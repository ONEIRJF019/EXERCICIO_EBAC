<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descobrindo valor de números</title>

    <link rel="stylesheet" href="./main.css">
</head>
<body>
    <header>
        <h1>Formulário</h1>
    </header>
    <div class="container">
        <h3>Preencha os campos no qual o formulário será válido se somente o numero B for maior que o A</h3>
        <div class="form">
            <form>
                <input id="numberA" type="number" placeholder="Número A">
                <input id="numberB" type="number" placeholder="Número B">
                <button type="submit">Validar </button>
            </form>
        </div>
    </div>
    <p id="MSGpositive" style="display: none;"></p>
    <p id="MSGnegative" style="display: none;"></p>
    <footer>
        <B>OneirJR&copy -2025 Todos os direitos reservados</B>
    </footer>
    <script src="./main.js"></script>
</body>
</html>
